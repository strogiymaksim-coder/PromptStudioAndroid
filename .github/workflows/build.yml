name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # Шаг автоматически подхватит настройки и кэш из вашего проекта
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    # Делаем скрипт сборки исполняемым на сервере Linux
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # ВАЖНО: Собираем через локальный ./gradlew вашего проекта
    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
